<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overdrive product icon proof</title>
  <style>
    @font-face { font-family:Overdrive; src:url('../product-icons/overdrive.woff') format('woff'); }
    body { margin:0; padding:42px; width:1200px; height:740px; box-sizing:border-box; background:#0c0a16; color:#f4efff; font-family:'Segoe UI',Arial,sans-serif; }
    h1 { margin:0 0 10px; font-size:33px; color:#ffad62; }
    p { color:#ad9bbc; margin:0 0 34px; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:17px; }
    .item { border:1px solid #694781; border-radius:9px; background:#21172f; height:155px; padding:15px; }
    .icon { font-family:Overdrive; color:#53f4ee; font-size:50px; display:block; line-height:75px; text-shadow:0 0 18px #53f4ee55; }
    .item span:last-child { font-size:13px; letter-spacing:1.2px; color:#d7c5e5; }
  </style>
</head>
<body>
  <h1>OVERDRIVE / PRODUCT ICONS</h1>
  <p>Original monochrome glyphs for VS Code navigation and controls</p>
  <div class="grid">
    <div class="item"><span class="icon">&#xe001;</span><span>EXPLORER</span></div>
    <div class="item"><span class="icon">&#xe002;</span><span>SEARCH</span></div>
    <div class="item"><span class="icon">&#xe003;</span><span>SOURCE CONTROL</span></div>
    <div class="item"><span class="icon">&#xe004;</span><span>RUN / DEBUG</span></div>
    <div class="item"><span class="icon">&#xe005;</span><span>EXTENSIONS</span></div>
    <div class="item"><span class="icon">&#xe006;</span><span>TERMINAL</span></div>
    <div class="item"><span class="icon">&#xe007;</span><span>SETTINGS</span></div>
    <div class="item"><span class="icon">&#xe00c;</span><span>COMMAND</span></div>
    <div class="item"><span class="icon">&#xe008;</span><span>CHEVRON RIGHT</span></div>
    <div class="item"><span class="icon">&#xe009;</span><span>CHEVRON DOWN</span></div>
    <div class="item"><span class="icon">&#xe00a;</span><span>CLOSE</span></div>
    <div class="item"><span class="icon">&#xe00b;</span><span>REFRESH</span></div>
  </div>
</body>
</html>
